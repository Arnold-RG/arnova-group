# Documents the arnova-africa-preview static site.
# This file is not wired as a Render Blueprint. Plain git pushes do not
# change the service. Do not enable Blueprint sync from this file unless
# that is decided separately.

services:
  - type: web
    name: arnova-africa-preview
    runtime: static
    branch: scope/africa-three-services
    buildCommand: echo 'No build needed'
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
